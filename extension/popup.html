<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>honest.money</title>
    <style>
      :root {
        --bg: #14100b;
        --card: #1e1812;
        --border: #3a2f22;
        --text: #f5efe6;
        --muted: #a89a86;
        --amber: #e8a33d;
        --amber-dark: #b97c1e;
        --red: #e0655a;
        --green: #6fbf73;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 360px;
        min-height: 480px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
      }
      #root { padding: 16px; }
      .header { text-align: center; margin-bottom: 16px; }
      .header img { width: 44px; height: 44px; border-radius: 10px; }
      .header h1 { font-size: 18px; font-weight: 700; margin-top: 6px; }
      .header p { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .card h2 { font-size: 15px; margin-bottom: 4px; }
      .card .desc { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
      input, textarea {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 9px 10px;
        font-size: 14px;
        font-family: inherit;
      }
      input:focus, textarea:focus { outline: 1px solid var(--amber); }
      textarea { resize: vertical; min-height: 64px; }
      button {
        display: inline-block;
        background: var(--amber);
        color: #1a1206;
        border: none;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
      button.ghost { background: transparent; color: var(--muted); padding: 9px 6px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .error { color: var(--red); font-size: 12px; margin-top: 8px; }
      .ok { color: var(--green); font-size: 12px; margin-top: 8px; }
      .balance { font-size: 30px; font-weight: 700; text-align: center; padding: 8px 0 2px; }
      .balance small { font-size: 14px; color: var(--muted); font-weight: 400; }
      .addr {
        word-break: break-all;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
        margin-top: 6px;
      }
      .words {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        margin: 10px 0;
      }
      .words span {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 7px;
        font-size: 12px;
        font-family: ui-monospace, monospace;
      }
      .words span i { color: var(--muted); font-style: normal; margin-right: 4px; }
      .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
      .tabs button {
        flex: 1;
        margin-top: 0;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-weight: 500;
      }
      .tabs button.active { background: var(--card); color: var(--text); border-color: var(--amber-dark); }
      .muted { color: var(--muted); font-size: 12px; }
      .center { text-align: center; }
      a { color: var(--amber); }
      .spin { text-align: center; color: var(--muted); padding: 20px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="dist/popup.js"></script>
  </body>
</html>
