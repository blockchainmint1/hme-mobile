# ONE-TIME helper. Add this file to the OLD repo (blockchainmint1/hme-mobile)
# at .github/workflows/copy-signing-secrets.yml, run it once from the Actions
# tab, then DELETE this file, the HME_WALLET_SECRETS_TOKEN secret, and the
# GitHub token you created for it.
#
# What it does: copies the four Android signing secrets that already live in
# hme-mobile straight into hme-wallet. No person ever sees the values; GitHub
# masks them in the logs. Only people with write access to hme-mobile can run
# it (manual trigger only — forks and pull requests cannot start it).
#
# Before running, in hme-mobile → Settings → Secrets and variables → Actions,
# add HME_WALLET_SECRETS_TOKEN = a fine-grained personal access token with:
#   Repository access: Only blockchainmint1/hme-wallet
#   Permissions: Secrets → Read and write   (nothing else)

name: Copy signing secrets to hme-wallet (one-time)

on:
  workflow_dispatch:

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the four ANDROID_* secrets
        env:
          GH_TOKEN: ${{ secrets.HME_WALLET_SECRETS_TOKEN }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in GH_TOKEN KS SP KA KP; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty in hme-mobile — stopping, nothing copied"; exit 1; fi
          done
          R=blockchainmint1/hme-wallet
          printf '%s' "$KS" | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$R"
          printf '%s' "$SP" | gh secret set ANDROID_STORE_PASSWORD  --repo "$R"
          printf '%s' "$KA" | gh secret set ANDROID_KEY_ALIAS       --repo "$R"
          printf '%s' "$KP" | gh secret set ANDROID_KEY_PASSWORD    --repo "$R"
          echo "Copied 4 signing secrets to $R"
